<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 產業研究 Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{--bg:#fff;--bg2:#f5f5f3;--bg3:#efefec;--text:#1a1a18;--text2:#6b6b67;--text3:#9b9b96;--border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.18);--blue:#378add;--green:#1d9e75;--red:#d85a30;--gold:#c8920a;--purple:#7c5cbf;--r:8px;--rl:12px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;--text:#f0f0ec;--text2:#a0a09a;--text3:#68685e;--border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.18);--gold:#e8c44a;--green:#5dcaa5;--red:#f0997b;--blue:#85b7eb;--purple:#a890e0}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg3);color:var(--text);font-size:13px}
.shell{max-width:1400px;margin:0 auto;background:var(--bg);min-height:100vh;border-left:.5px solid var(--border);border-right:.5px solid var(--border)}
.topbar{padding:.875rem 1.5rem;border-bottom:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;background:var(--bg)}
.brand{font-size:17px;font-weight:600}
.sub{font-size:11px;color:var(--text2);margin-top:2px;display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;flex-shrink:0}
button{font-size:12px;padding:5px 12px;border-radius:var(--r);border:.5px solid var(--border2);background:var(--bg);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:background .12s;white-space:nowrap}
button:hover{background:var(--bg2)}
.mkt{padding:1rem 1.5rem;border-bottom:.5px solid var(--border)}
.section-label{font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--text3);text-transform:uppercase;margin-bottom:.6rem}
.sig-row{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px;margin-bottom:.75rem}
.sig{padding:10px 14px;border-radius:var(--rl);border:.5px solid var(--border)}
.sig-name{font-size:10px;font-weight:500;color:var(--text2);margin-bottom:5px}
.sig-val{font-size:17px;font-weight:500}
.sig-hint{font-size:10px;color:var(--text3);margin-top:3px;line-height:1.5}
.safe{background:var(--bg2)}.safe .sig-val{color:var(--text3)}
.charging{background:rgba(200,146,10,.1);border-color:var(--gold)!important}.charging .sig-val{color:#854f0b}
.escaping{background:rgba(216,90,48,.1);border-color:var(--red)!important}.escaping .sig-val{color:#993c1d}
.ok{background:rgba(29,158,117,.08);border-color:var(--green)!important}.ok .sig-val{color:#0f6e56}
.env-row{display:flex;gap:6px;flex-wrap:wrap}
.etag{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:500}
.etag-gold{background:#faeeda;color:#854f0b}
.etag-blue{background:#e6f1fb;color:#185fa5}
.etag-red{background:#fcebeb;color:#a32d2d}
.etag-gray{background:var(--bg2);color:var(--text2)}
.stocks{padding:1rem 1.5rem}
.stock-head{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:.75rem}
.tsmc-hint{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 7px;border-radius:8px;background:#e6f1fb;color:#185fa5;font-weight:500}
.badge-green{background:#eaf3de;color:#3b6d11}
.toolbar{display:flex;gap:6px;margin-bottom:.75rem;flex-wrap:wrap;align-items:center}
.chip{font-size:11px;padding:3px 10px;border-radius:12px;border:.5px solid var(--border);cursor:pointer;color:var(--text2);background:var(--bg);white-space:nowrap}
.chip:hover,.chip.on{background:var(--bg2);color:var(--text);border-color:var(--border2)}
.chip.hi{border-color:var(--green);color:var(--green)}
.chip.hi.on{background:rgba(29,158,117,.1)}
.srch input{padding:5px 10px;border-radius:var(--r);border:.5px solid var(--border);background:var(--bg2);color:var(--text);font-size:12px;outline:none;width:160px}
.srch input:focus{border-color:var(--blue)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{padding:7px 10px;text-align:left;font-weight:500;font-size:10px;color:var(--text2);border-bottom:.5px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;background:var(--bg);position:sticky;top:0;z-index:2}
thead th:first-child{position:sticky;top:0;left:0;z-index:3;background:var(--bg)}
tbody td:first-child{position:sticky;left:0;background:var(--bg);z-index:1;border-right:.5px solid var(--border)}
tbody tr:hover td:first-child{background:var(--bg2)}
thead th:hover{color:var(--text)}
thead th.desc::after{content:" ↓"}thead th.asc::after{content:" ↑"}
tbody tr{border-bottom:.5px solid var(--border);transition:background .08s}
tbody tr:hover{background:var(--bg2)}
td{padding:7px 10px;white-space:nowrap}
.sc{display:flex;align-items:center;gap:5px}
.bar{width:44px;height:4px;border-radius:2px;background:var(--bg3);overflow:hidden;flex-shrink:0}
.bf{height:100%;border-radius:2px}
.above{color:var(--green);font-weight:500}
.below{color:var(--text2)}
.wt12{color:var(--gold);font-weight:500}
.k3{color:var(--green);font-size:11px;font-weight:500}
.k2{color:#5d9e5d;font-size:11px}
.k0{color:var(--red);font-size:11px;font-weight:500}
.kn{color:var(--text3);font-size:11px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:2rem;text-align:center;color:var(--text2)}
@media(max-width:768px){.sig-row{grid-template-columns:1fr 1fr}.shell{border:none}}
</style>
</head>
<body>
<div class="shell">

<div class="topbar">
  <div>
    <div class="brand">AI 產業研究 Dashboard</div>
    <div class="sub" id="sub"><span class="spin"></span>載入中...</div>
  </div>
  <button onclick="reloadAll()">&#8635; 重新整理</button>
</div>

<div class="mkt">
  <div class="section-label">貨幣市場訊號</div>
  <div class="sig-row">
    <div class="sig safe" id="sig-escape">
      <div class="sig-name">逃命訊號</div>
      <div class="sig-val" id="escape-val"><span class="spin"></span></div>
      <div class="sig-hint" id="escape-hint">出現 1 個立即逃命</div>
    </div>
    <div class="sig safe" id="sig-charge">
      <div class="sig-name">衝（槓桿攻擊）</div>
      <div class="sig-val" id="charge-val"><span class="spin"></span></div>
      <div class="sig-hint" id="charge-hint">出現 1 個即槓桿攻擊</div>
    </div>
    <div class="sig ok" id="sig-action">
      <div class="sig-name">目前操作建議</div>
      <div class="sig-val" id="action-val"><span class="spin"></span></div>
      <div class="sig-hint" id="action-hint"></div>
    </div>
  </div>
  <div class="env-row" id="env-row">
    <span class="etag etag-gray"><span class="spin" style="width:12px;height:12px;border-width:1.5px"></span> 讀取環境資料...</span>
  </div>
</div>

<div class="stocks">
  <div class="stock-head">
    <div>
      <div style="font-size:15px;font-weight:600">產業評分地圖</div>
      <div class="tsmc-hint">
        持有門檻：基本面分 ≥ <span class="badge">台積電 7.0</span>
        · 技術籌碼分越高越適合進場
        <span class="badge badge-green">★ 綠色 = 達標</span>
      </div>
    </div>
    <div style="font-size:11px" id="stock-ts"></div>
  </div>
  <div class="toolbar">
    <div class="chip on" onclick="setW('all',this)">全部</div>
    <div class="chip" onclick="setW('1.2',this)">加權 1.2 ★</div>
    <div class="chip" onclick="setW('1.1',this)">加權 1.1</div>
    <div class="chip" onclick="setW('1.0',this)">加權 1.0</div>
    <div class="chip hi" id="above-btn" onclick="toggleAbove(this)">★ 達台積標準</div>
    <div class="chip" id="fund-btn" onclick="toggleFund(this)" style="border-color:var(--blue);color:var(--blue)">基本面 ≥ 7.0</div>
    <div class="srch"><input id="q" placeholder="搜尋名稱或代號..." oninput="render()"></div>
  </div>
  <div id="stock-loading" class="loading"><span class="spin"></span>載入產業資料...</div>
  <div class="tw" id="tw" style="display:none">
    <table>
      <thead><tr>
        <th onclick="sort('name')">名稱</th>
        <th onclick="sort('code')">代號</th>
        <th onclick="sort('sector')">產業</th>
        <th onclick="sort('weight')">加權</th>
        <th onclick="sort('price')">股價</th>
        <th onclick="sort('fund')">基本面分</th>
        <th onclick="sort('tech')">技術籌碼分</th>
        <th onclick="sort('total')">總分</th>
        <th onclick="sort('kline')">K線分</th>
        <th onclick="sort('group')">族群分</th>
        <th onclick="sort('pe')">本益比</th>
      </tr></thead>
      <tbody id="tbl"></tbody>
    </table>
  </div>
</div>

</div>
<script>
const STOCK_CSV = "https://docs.google.com/spreadsheets/d/1a7-82Bi2__vGzbXFV7EsJiugt7e87F36bxox3XjA5dQ/export?format=csv&gid=1374358104";
const MKT_CSV   = "https://docs.google.com/spreadsheets/d/1IgRRZIwKmQ-9T7od3obIQxw5yvO1sgTzvEAOq40xAUw/export?format=csv&gid=0";
const TSMC_FUND = 7.0;

let STOCKS = [], MKT = { escape:0, charge:0, rows:[] };
let wF = 'all', aboveOnly = false, fundAbove = false, sortK = 'total', sortD = -1;

const n = v => parseFloat(String(v||'').replace(/[^\d.\-]/g,'')) || 0;

function fv(row, keys) {
  const rk = Object.keys(row);
  for (const k of keys) {
    const v = row[k];
    if (v !== undefined && String(v).trim() !== '') return String(v).trim();
    const nm = k.replace(/\s+/g, '');
    const fd = rk.find(r => r.replace(/\s+/g, '') === nm);
    if (fd && String(row[fd]).trim() !== '') return String(row[fd]).trim();
  }
  return '';
}

// ── 貨幣市場 ──
function loadMkt() {
  fetch(MKT_CSV)
    .then(r => r.text())
    .then(text => {
      const res = Papa.parse(text, { header: true, skipEmptyLines: true });
      let escape = 0, charge = 0, rows = [];
      res.data.forEach(r => {
        const lamp = String(r['燈號'] || '').trim();
        const ind  = String(r['指標'] || '').trim();
        const val  = String(r['數值'] || '').trim();
        const mkt  = String(r['現在行情'] || '').trim();
        if (!ind || ind === '-') return;
        if (lamp === '逃命') escape++;
        if (lamp === '衝') charge++;
        rows.push({ ind, val, lamp, mkt });
      });
      MKT = { escape, charge, rows };
      renderMkt();
    })
    .catch(() => renderMktFallback());
}

function renderMkt() {
  const { escape, charge, rows } = MKT;

  const eCard = document.getElementById('sig-escape');
  eCard.className = 'sig ' + (escape > 0 ? 'escaping' : 'safe');
  document.getElementById('escape-val').textContent  = escape > 0 ? '⚠ 逃命 × ' + escape : '✓ 安全';
  document.getElementById('escape-hint').textContent = escape > 0 ? '立即執行逃命策略！' : '出現 1 個立即逃命（最多 4 個）';

  const cCard = document.getElementById('sig-charge');
  cCard.className = 'sig ' + (charge > 0 ? 'charging' : 'safe');
  document.getElementById('charge-val').textContent  = charge > 0 ? '⚡ 衝 × ' + charge : '— 未觸發';
  document.getElementById('charge-hint').textContent = charge > 0 ? '槓桿攻擊訊號觸發！' : '出現 1 個即槓桿攻擊（最多 3 個）';

  const aCard = document.getElementById('sig-action');
  if (escape > 0) {
    aCard.className = 'sig escaping';
    document.getElementById('action-val').textContent  = '立即逃命';
    document.getElementById('action-hint').textContent = '清倉，等待訊號解除';
  } else if (charge > 0) {
    aCard.className = 'sig charging';
    document.getElementById('action-val').textContent  = '槓桿攻擊';
    document.getElementById('action-hint').textContent = '可執行槓桿部位，持續關注逃命訊號';
  } else {
    aCard.className = 'sig ok';
    document.getElementById('action-val').textContent  = '可進場，無槓桿';
    document.getElementById('action-hint').textContent = '無逃命訊號 → 維持持倉\n等待「衝」訊號再加槓桿';
  }

  // 環境標籤：只顯示特定指標的數值，不顯示 F 欄行情文字
  const tags = [];
  rows.forEach(r => {
    if (r.ind === 'M2')    tags.push({ t: '降息 QE、類QE', cls: 'etag-gold' });
    if (r.ind === 'SP500') tags.push({ t: 'SP500 ' + r.val, cls: 'etag-blue' });
    if (r.ind === 'FED')   tags.push({ t: 'FED ' + r.val, cls: 'etag-blue' });
    if (r.ind === 'CPI')   tags.push({ t: 'CPI ' + r.val, cls: r.lamp === '警戒' ? 'etag-red' : 'etag-gray' });
    if (r.ind === 'TECL')  tags.push({ t: 'TECL ' + r.val, cls: 'etag-gray' });
    if (r.ind === '匯率')  tags.push({ t: '匯率 ' + r.val, cls: 'etag-gray' });
  });
  document.getElementById('env-row').innerHTML = tags.slice(0, 6)
    .map(t => '<span class="etag ' + t.cls + '">' + t.t + '</span>').join('');
}

function renderMktFallback() {
  document.getElementById('escape-val').textContent = '無法讀取';
  document.getElementById('charge-val').textContent = '無法讀取';
  document.getElementById('action-val').textContent = '請重新整理';
  document.getElementById('env-row').innerHTML = '<span class="etag etag-gray">貨幣市場表讀取失敗</span>';
}

// ── 產業資料 ──
function loadStocks() {
  fetch(STOCK_CSV)
    .then(r => r.text())
    .then(text => {
      const res = Papa.parse(text, { header: true, skipEmptyLines: true });
      // 先解析所有資料
      const rawStocks = res.data.map(r => {
        const name  = fv(r, ['名稱']);
        const total = n(fv(r, ['總分']));
        if (!name || !total) return null;
        return {
          name:   name,
          code:   fv(r, ['代號']),
          sector: fv(r, ['類別']),
          weight: n(fv(r, ['類別加權'])),
          fund:   n(fv(r, ['基本面分'])),
          tech:   n(fv(r, ['技術籌碼分'])),
          total:  total,
          price:  n(fv(r, ['當日股價'])),
          kline:  n(fv(r, ['K線分'])),
          group:  n(fv(r, ['族群分'])),
          pe:     n(fv(r, ['TTM', '本益比'])),
          date:   fv(r, ['日期']),
        };
      }).filter(Boolean);

      // 去重：同一代號只保留族群分最高的那筆
      const dedup = {};
      rawStocks.forEach(r => {
        const key = r.code || r.name;
        if (!dedup[key] || r.group > dedup[key].group) dedup[key] = r;
      });
      STOCKS = Object.values(dedup);

      document.getElementById('stock-loading').style.display = 'none';
      document.getElementById('tw').style.display = 'block';

      // 讀 H 欄時間
      const tsEl = document.getElementById('stock-ts');
      const first = STOCKS[0];
      if (first && first.date && !first.date.includes('TODAY')) {
        const m = first.date.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?/);
        if (m) {
          const updated = new Date(m[1], m[2]-1, m[3], m[4]||0, m[5]||0);
          const diffH   = (new Date() - updated) / 3600000;
          tsEl.textContent = '資料更新：' + first.date;
          tsEl.style.color = diffH > 25 ? 'var(--red)' : 'var(--green)';
          if (diffH > 25) tsEl.textContent += ' ⚠ 超過1天未更新';
        }
      } else {
        const now = new Date();
        tsEl.textContent = 'Dashboard 載入：' + (now.getMonth()+1) + '/' + now.getDate() + ' ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
        tsEl.style.color = 'var(--text3)';
      }

      render();
      const now = new Date();
      document.getElementById('sub').innerHTML = '<span class="dot"></span> 即時同步 · ' + STOCKS.length + ' 檔個股 · ' + (now.getMonth()+1) + '/' + now.getDate();
    })
    .catch(e => {
      document.getElementById('stock-loading').textContent = '載入失敗：' + e.message + '　請重新整理';
    });
}

// ── 表格 ──
function techLabel(k) {
  if (k >= 3) return { l: '▲ 多頭', c: 'k3' };
  if (k >= 2) return { l: '△ 偏多', c: 'k2' };
  if (k === 0) return { l: '▼ 空頭', c: 'k0' };
  return { l: '— 整理', c: 'kn' };
}

function getRows() {
  const q = (document.getElementById('q') || {}).value.toLowerCase() || '';
  return STOCKS.filter(r => {
    if (wF !== 'all' && r.weight.toFixed(1) !== wF) return false;
    if (aboveOnly && r.fund < TSMC_FUND) return false;
    if (fundAbove && r.fund < TSMC_FUND) return false;
    if (q && !r.name.includes(q) && !r.code.toLowerCase().includes(q) && !r.sector.includes(q)) return false;
    return true;
  }).sort((a, b) => {
    const av = a[sortK] ?? 0, bv = b[sortK] ?? 0;
    return typeof av === 'string' ? av.localeCompare(bv) * sortD : (av - bv) * sortD;
  });
}

function render() {
  const rows = getRows();
  if (!rows.length) {
    document.getElementById('tbl').innerHTML = '<tr><td colspan="11" style="padding:2rem;text-align:center;color:var(--text3)">沒有符合條件的資料</td></tr>';
    return;
  }
  const maxF   = Math.max(...rows.map(r => r.fund), TSMC_FUND + 1);
  const maxT   = Math.max(...rows.map(r => r.tech), 10);
  const maxTot = Math.max(...rows.map(r => r.total), 15);

  document.getElementById('tbl').innerHTML = rows.map(r => {
    const above   = r.fund >= TSMC_FUND;
    const sig     = techLabel(r.kline);
    const wtCls   = r.weight >= 1.2 ? 'wt12' : '';
    const fundCls = above ? 'above' : 'below';
    const fundIcon = above ? '★ ' : '';
    const pF   = Math.round(r.fund / maxF * 100);
    const pT   = Math.round(r.tech / maxT * 100);
    const pTot = Math.round(r.total / maxTot * 100);
    const grpStyle = r.group >= 2 ? 'color:var(--blue);font-weight:500' : 'color:var(--text2)';
    return '<tr>' +
      '<td style="font-weight:500">' + r.name + '</td>' +
      '<td style="color:var(--text2)">' + r.code + '</td>' +
      '<td>' + r.sector + '</td>' +
      '<td class="' + wtCls + '">' + r.weight.toFixed(1) + '</td>' +
      '<td style="font-weight:500">' + (r.price > 0 ? r.price.toLocaleString() : '—') + '</td>' +
      '<td><div class="sc"><span class="' + fundCls + '">' + fundIcon + r.fund.toFixed(1) + '</span><div class="bar"><div class="bf" style="width:' + pF + '%;background:' + (above ? 'var(--green)' : 'var(--blue)') + '"></div></div></div></td>' +
      '<td><div class="sc"><span style="color:var(--purple)">' + r.tech.toFixed(1) + '</span><div class="bar"><div class="bf" style="width:' + pT + '%;background:var(--purple)"></div></div></div></td>' +
      '<td><div class="sc"><span style="font-weight:500">' + r.total.toFixed(1) + '</span><div class="bar"><div class="bf" style="width:' + pTot + '%;background:var(--gold)"></div></div></div></td>' +
      '<td style="color:var(--text2)">' + r.kline.toFixed(1) + '</td>' +
      '<td style="' + grpStyle + '">' + r.group.toFixed(1) + '</td>' +
      '<td style="color:var(--text2)">' + (r.pe > 0 ? r.pe.toFixed(1) : '—') + '</td>' +
      '</tr>';
  }).join('');
}

function setW(w, el) {
  wF = w;
  document.querySelectorAll('.chip:not(.hi)').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  render();
}
function toggleAbove(el) {
  aboveOnly = !aboveOnly;
  el.classList.toggle('on');
  el.textContent = aboveOnly ? '★ 達台積標準（篩選中）' : '★ 達台積標準';
  render();
}
function toggleFund(el) {
  fundAbove = !fundAbove;
  el.classList.toggle('on');
  if (fundAbove) { el.style.background='rgba(55,138,221,.1)'; el.textContent='基本面 ≥ 7.0（篩選中）'; }
  else { el.style.background=''; el.textContent='基本面 ≥ 7.0'; }
  render();
}
function sort(k) {
  sortD = sortK === k ? sortD * -1 : -1;
  sortK = k;
  document.querySelectorAll('thead th').forEach(th => {
    th.classList.remove('asc', 'desc');
    if (th.getAttribute('onclick') === "sort('" + k + "')") th.classList.add(sortD === -1 ? 'desc' : 'asc');
  });
  render();
}
function reloadAll() { loadMkt(); loadStocks(); }

loadMkt();
loadStocks();
</script>
</body>
