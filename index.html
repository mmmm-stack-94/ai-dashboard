<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 基建產業研究 Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{--bg:#fff;--bg2:#f5f5f3;--bg3:#efefec;--text:#1a1a18;--text2:#6b6b67;--text3:#9b9b96;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);--info-bg:#e6f1fb;--info-text:#185fa5;--warn-bg:#faeeda;--warn-text:#854f0b;--green:#1d9e75;--red:#d85a30;--blue:#378add;--gold:#c8920a;--r:8px;--rl:12px}
  @media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;--text:#f0f0ec;--text2:#a0a09a;--text3:#68685e;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);--info-bg:#0c447c;--info-text:#b5d4f4;--warn-bg:#633806;--warn-text:#fac775;--green:#5dcaa5;--red:#f0997b;--blue:#85b7eb;--gold:#e8c44a}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg3);color:var(--text);font-size:14px}
  .shell{max-width:1400px;margin:0 auto;background:var(--bg);min-height:100vh;border-left:.5px solid var(--border);border-right:.5px solid var(--border)}
  .top-bar{padding:1rem 1.5rem;border-bottom:.5px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .brand h1{font-size:18px;font-weight:600}
  .brand p{font-size:12px;color:var(--text2);margin-top:2px;display:flex;align-items:center;gap:6px}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;flex-shrink:0}
  .right-panel{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button{font-size:12px;padding:6px 14px;border-radius:var(--r);border:.5px solid var(--border2);background:var(--bg);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background .15s;white-space:nowrap}
  button:hover{background:var(--bg2)}
  button.active{background:var(--info-bg);color:var(--info-text);border-color:transparent}
  button.ai-btn{background:var(--blue);color:#fff;border-color:transparent}
  button.ai-btn:hover{opacity:.88}
  button.ai-btn:disabled{opacity:.5;cursor:not-allowed}
  .legend{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .li{display:flex;align-items:center;gap:4px}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:1rem 1.5rem;border-bottom:.5px solid var(--border)}
  .stat{background:var(--bg2);border-radius:var(--r);padding:10px 14px}
  .stat-label{font-size:11px;color:var(--text2);margin-bottom:4px}
  .stat-val{font-size:22px;font-weight:600}
  .sec-bar{display:flex;gap:6px;padding:.75rem 1.5rem;border-bottom:.5px solid var(--border);flex-wrap:wrap}
  .chip{font-size:11px;padding:4px 12px;border-radius:20px;border:.5px solid var(--border);cursor:pointer;color:var(--text2);background:var(--bg);white-space:nowrap;transition:all .15s}
  .chip:hover,.chip.active{background:var(--bg2);color:var(--text);border-color:var(--border2)}
  .search-row{padding:.75rem 1.5rem;border-bottom:.5px solid var(--border)}
  .search-row input{width:100%;padding:7px 12px;border-radius:var(--r);border:.5px solid var(--border);background:var(--bg2);color:var(--text);font-size:13px;outline:none}
  .search-row input:focus{border-color:var(--blue)}
  .ai-box{margin:1rem 1.5rem;padding:1rem 1.25rem;border-radius:var(--rl);border:.5px solid var(--border);background:var(--bg2);font-size:13px;line-height:1.8;display:none}
  .ai-box-title{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
  .ai-close{cursor:pointer;color:var(--text3);font-size:18px;line-height:1}
  .ai-content{color:var(--text);white-space:pre-wrap}
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{padding:9px 12px;text-align:left;font-weight:500;font-size:11px;color:var(--text2);border-bottom:.5px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;background:var(--bg);position:sticky;top:0;z-index:1}
  thead th:hover{color:var(--text)}
  thead th.asc::after{content:" ↑"}thead th.desc::after{content:" ↓"}
  tbody tr{border-bottom:.5px solid var(--border);transition:background .1s}
  tbody tr:hover{background:var(--bg2)}
  td{padding:9px 12px;white-space:nowrap}
  .rc{background:rgba(200,146,10,.09)}.rc:hover{background:rgba(200,146,10,.16) !important}
  .rt{background:rgba(250,199,117,.06)}.rt:hover{background:rgba(250,199,117,.12) !important}
  .tb{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500}
  .t1b{background:var(--warn-bg);color:var(--warn-text)}
  .t2b{background:var(--info-bg);color:var(--info-text)}
  .star{color:var(--gold);font-size:14px;margin-left:3px;vertical-align:middle}
  .sbar{display:inline-block;width:48px;height:5px;border-radius:3px;background:var(--bg3);vertical-align:middle;margin-left:6px;overflow:hidden}
  .sf{height:100%;border-radius:3px;background:var(--blue)}
  .tb-b{color:var(--green);font-size:11px;font-weight:500}
  .tb-s{color:var(--red);font-size:11px;font-weight:500}
  .tb-n{color:var(--text3);font-size:11px}
  .tag-up{font-size:10px;padding:1px 5px;border-radius:3px;background:#eaf3de;color:#3b6d11;margin-left:3px}
  .loading{padding:3rem;text-align:center;color:var(--text2)}
  .spin{display:inline-block;width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{margin:1rem 1.5rem;padding:1rem 1.25rem;border-radius:var(--r);background:#fcebeb;color:#a32d2d;font-size:13px;line-height:1.7;border:.5px solid #f09595}
  .empty{padding:2rem;text-align:center;color:var(--text3)}
  @media(max-width:768px){.stats{grid-template-columns:repeat(2,1fr)}.top-bar{flex-direction:column}}
</style>
</head>
<body>
<div class="shell">
<div class="top-bar">
  <div class="brand">
    <h1>AI 基建產業研究</h1>
    <p id="sub"><span class="spin"></span>連接 Google Sheets...</p>
  </div>
  <div class="right-panel">
    <div class="controls">
      <button class="active" onclick="setTier('all',this)">全部</button>
      <button onclick="setTier('1',this)"><span class="tb t1b">T1</span> 主要供應商</button>
      <button onclick="setTier('2',this)"><span class="tb t2b">T2</span> 次要供應商</button>
      <button onclick="loadData()">&#8635; 重新整理</button>
      <button class="ai-btn" id="ai-btn" onclick="runAI()">✦ AI 解讀今日資料</button>
    </div>
    <div class="legend">
      <div class="li"><span style="color:var(--gold);font-size:14px">★</span> 主要供應商</div>
      <div class="li"><span style="display:inline-block;width:12px;height:12px;background:rgba(200,146,10,.2);border-radius:2px"></span> T1 已確認</div>
      <div class="li"><span style="display:inline-block;width:12px;height:12px;background:rgba(250,199,117,.12);border-radius:2px"></span> T1 觀察中</div>
      <div class="li"><span class="tag-up">↑</span> 本期噴出</div>
    </div>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-label">追蹤個股</div><div class="stat-val" id="s-n">—</div></div>
  <div class="stat"><div class="stat-label">★ 主要供應商</div><div class="stat-val" id="s-conf">—</div></div>
  <div class="stat"><div class="stat-label">平均總分</div><div class="stat-val" id="s-avg">—</div></div>
  <div class="stat"><div class="stat-label">技術面多頭</div><div class="stat-val" id="s-bull" style="color:var(--green)">—</div></div>
  <div class="stat"><div class="stat-label">更新時間</div><div class="stat-val" id="s-ts" style="font-size:15px">—</div></div>
</div>

<div class="sec-bar" id="sec-bar"><div class="chip active" onclick="setSec('all',this)">全部產業</div></div>
<div class="search-row"><input id="q" type="text" placeholder="搜尋名稱或代號..." oninput="render()"></div>

<div class="ai-box" id="ai-box">
  <div class="ai-box-title">
    <span>✦ AI 分析報告</span>
    <span class="ai-close" onclick="document.getElementById('ai-box').style.display='none'">×</span>
  </div>
  <div id="ai-content" class="ai-content"></div>
</div>

<div id="loading" class="loading"><span class="spin"></span>載入資料中，請稍候...</div>
<div id="err" style="display:none"></div>
<div class="tbl-wrap" id="tbl-wrap" style="display:none">
  <table>
    <thead><tr>
      <th onclick="sort('name')">名稱</th>
      <th onclick="sort('code')">代號</th>
      <th onclick="sort('sector')">產業</th>
      <th onclick="sort('tier')">Tier</th>
      <th onclick="sort('score')">總分</th>
      <th onclick="sort('price')">股價</th>
      <th onclick="sort('pe')">TTM P/E</th>
      <th onclick="sort('rev1')">單月營收(億)</th>
      <th onclick="sort('rev3')">3月均收(億)</th>
      <th onclick="sort('gm_q')">單季毛利率</th>
      <th onclick="sort('gm_4q')">近4Q毛利率</th>
      <th onclick="sort('eps_q')">單季EPS</th>
      <th onclick="sort('eps_4q')">近4Q EPS</th>
      <th onclick="sort('tech')">技術面</th>
    </tr></thead>
    <tbody id="tbl"></tbody>
  </table>
</div>
</div>

<script>
// ★ 設定區
const CSV_URL = "https://docs.google.com/spreadsheets/d/1ONTKDdNcXo-TVJHQQAvrFtiKU_XOzTGJcext3GxSjrE/export?format=csv&gid=619957500";
const API_KEY = "YOUR_API_KEY_HERE"; // ← 填入你的 Anthropic API Key

const CONFIRMED = new Set(['2317','1513','2327','3017','3324','2404','6139','1519','2308','5274',
  'NVDA','2330','2368','3037','2383','2492','ASML','AMAT','FLEX','2481','5425','3707','2455','6488']);

let DATA=[], tierF='all', secF='all', sortK='score', sortD=-1;

// K線分對應（你原本 Excel 的邏輯）
// 3=多頭  2=偏多  1=整理  0=空頭  ''=無資料
function techFromK(k){
  const v=parseFloat(k);
  if(isNaN(v)||k==='') return {l:'— 無資料',c:'tb-n',score:0};
  if(v>=3)  return {l:'▲ 多頭',c:'tb-b',score:3};
  if(v>=2)  return {l:'△ 偏多',c:'tb-b',score:2};
  if(v===0) return {l:'▼ 空頭',c:'tb-s',score:0};
  return {l:'— 整理',c:'tb-n',score:1};
}

function fv(row,keys){
  const rk=Object.keys(row);
  for(const k of keys){
    const v=row[k];
    if(v!==undefined&&String(v).trim()!='') return String(v).trim();
    const norm=k.replace(/\s+/g,'');
    const found=rk.find(r=>r.replace(/\s+/g,'')==norm);
    if(found&&String(row[found]).trim()!='') return String(row[found]).trim();
  }
  return '';
}
const n=v=>parseFloat(String(v||'').replace(/[^\d.\-]/g,''))||0;

function loadData(){
  document.getElementById('loading').style.display='block';
  document.getElementById('tbl-wrap').style.display='none';
  document.getElementById('err').style.display='none';
  document.getElementById('ai-box').style.display='none';
  document.getElementById('sub').innerHTML='<span class="spin"></span>連接 Google Sheets...';

  Papa.parse(CSV_URL,{download:true,header:true,skipEmptyLines:true,
    complete(res){
      try{
        if(res.data.length>0) console.log('欄位：',Object.keys(res.data[0]).slice(0,20));
        DATA=res.data.map(r=>({
          name:   fv(r,['名稱']),
          code:   fv(r,['代號']),
          sector: fv(r,['類別']),
          tier:   parseInt(fv(r,['TIER','Tier','tier'])||0),
          score:  n(fv(r,['總分'])),
          price:  n(fv(r,['當日股價'])),
          pe:     n(fv(r,['TTM'])),
          kline:  fv(r,['K線分']),
          rev1:   n(fv(r,['單月 營收 (億)','單月營收(億)','單月  營收  (億)'])),
          rev3:   n(fv(r,['3 個月 營收 平均 (億)','3  個月  營收  平均  (億)','3個月營收平均(億)'])),
          gm_q:   n(fv(r,['最新 單季 毛利 率 (%)','最新  單季  毛利  率  (%)','最新單季毛利率(%)'])),
          gm_4q:  n(fv(r,['最新 近4Q 毛利 率 (%)','最新  近4Q  毛利  率  (%)','最新近4Q毛利率(%)'])),
          eps_q:  n(fv(r,['最新 單季 每股 盈餘 (元)','最新  單季  每股  盈餘  (元)','最新單季每股盈餘(元)'])),
          eps_4q: n(fv(r,['最新 近4Q 每股 盈餘 (元)','最新  近4Q  每股  盈餘  (元)','最新近4Q每股盈餘(元)'])),
          rev_up: fv(r,['營收噴'])==='1',
          gm_up:  fv(r,['毛利漲'])==='1',
          eps_up: fv(r,['盈餘噴'])==='1',
        })).filter(r=>r.name&&(r.tier===1||r.tier===2)&&r.score>0);

        if(!DATA.length) throw new Error('篩選後無資料，請開啟 Console 確認欄位名稱');
        buildSecs(); render();
        document.getElementById('loading').style.display='none';
        document.getElementById('tbl-wrap').style.display='block';
        const now=new Date();
        document.getElementById('s-ts').textContent=(now.getMonth()+1)+'/'+now.getDate()+' '+now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
        document.getElementById('sub').innerHTML='<span class="live-dot"></span> 即時資料 · Google Sheets 同步 · '+DATA.length+' 筆';
      }catch(e){showErr('資料解析失敗：'+e.message);}
    },
    error(e){showErr('無法連接：'+(e.message||'未知錯誤')+'<br>請確認試算表已設為「知道連結的任何人可檢視」');}
  });
}

function getRows(){
  const q=(document.getElementById('q')||{}).value.toLowerCase()||'';
  return DATA.filter(r=>{
    if(tierF!=='all'&&String(r.tier)!==tierF) return false;
    if(secF!=='all'&&r.sector!==secF) return false;
    if(q&&!r.name.includes(q)&&!r.code.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>{
    const av=sortK==='tech'?techFromK(a.kline).score:(a[sortK]??0);
    const bv=sortK==='tech'?techFromK(b.kline).score:(b[sortK]??0);
    return typeof av==='string'?av.localeCompare(bv)*sortD:(av-bv)*sortD;
  });
}

function render(){
  const rows=getRows(), max=Math.max(...rows.map(r=>r.score),25);
  document.getElementById('tbl').innerHTML=rows.map(r=>{
    const conf=CONFIRMED.has(r.code), sig=techFromK(r.kline);
    const rc=conf?'rc':(r.tier===1?'rt':'');
    const star=conf?'<span class="star" title="主要供應商">★</span>':'';
    const pct=Math.round(r.score/max*100);
    return`<tr class="${rc}">
      <td><span style="font-weight:500">${r.name}</span>${star}</td>
      <td style="color:var(--text2)">${r.code}</td>
      <td>${r.sector}</td>
      <td><span class="tb ${r.tier===1?'t1b':'t2b'}">T${r.tier}</span></td>
      <td><span style="font-weight:500">${r.score.toFixed(1)}</span><span class="sbar"><span class="sf" style="width:${pct}%"></span></span></td>
      <td style="font-weight:500">${r.price>0?r.price.toLocaleString():'—'}</td>
      <td style="color:var(--text2)">${r.pe>0?r.pe.toFixed(1):'—'}</td>
      <td>${r.rev1>0?r.rev1.toLocaleString():'—'}${r.rev_up?'<span class="tag-up">↑</span>':''}</td>
      <td style="color:var(--text2)">${r.rev3>0?r.rev3.toLocaleString():'—'}</td>
      <td>${r.gm_q>0?r.gm_q.toFixed(1)+'%':'—'}${r.gm_up?'<span class="tag-up">↑</span>':''}</td>
      <td style="color:var(--text2)">${r.gm_4q>0?r.gm_4q.toFixed(1)+'%':'—'}</td>
      <td>${r.eps_q!==0?r.eps_q.toFixed(2):'—'}${r.eps_up?'<span class="tag-up">↑</span>':''}</td>
      <td style="color:var(--text2)">${r.eps_4q!==0?r.eps_4q.toFixed(2):'—'}</td>
      <td><span class="${sig.c}">${sig.l}</span></td>
    </tr>`;
  }).join('')||'<tr><td colspan="14" class="empty">沒有符合條件的資料</td></tr>';

  const bull=rows.filter(r=>techFromK(r.kline).score>=3).length;
  document.getElementById('s-n').textContent=rows.length;
  document.getElementById('s-conf').textContent=rows.filter(r=>CONFIRMED.has(r.code)).length;
  document.getElementById('s-avg').textContent=rows.length?(rows.reduce((a,r)=>a+r.score,0)/rows.length).toFixed(1):'—';
  document.getElementById('s-bull').textContent=bull;
}

function buildSecs(){
  const secs=[...new Set(DATA.map(r=>r.sector))].filter(Boolean).sort();
  document.getElementById('sec-bar').innerHTML='<div class="chip active" onclick="setSec(\'all\',this)">全部產業</div>'+secs.map(s=>`<div class="chip" onclick="setSec('${s.replace(/'/g,"\\'")}',this)">${s}</div>`).join('');
}
function setTier(t,el){tierF=t;document.querySelectorAll('.controls button:not(.ai-btn)').forEach(b=>b.classList.remove('active'));el.classList.add('active');render();}
function setSec(s,el){secF=s;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');render();}
function sort(k){
  sortD=sortK===k?sortD*-1:-1;sortK=k;
  document.querySelectorAll('thead th').forEach(th=>{th.classList.remove('asc','desc');if(th.getAttribute('onclick')===`sort('${k}')`)th.classList.add(sortD===-1?'desc':'asc');});render();
}
function showErr(msg){
  document.getElementById('loading').style.display='none';
  const e=document.getElementById('err');e.style.display='block';
  e.innerHTML=`<div class="err"><strong>載入失敗</strong><br>${msg}</div>`;
  document.getElementById('sub').textContent='連接失敗';
}

async function runAI(){
  if(API_KEY==='YOUR_API_KEY_HERE'){alert('請用文字編輯器開啟 index.html，找到 const API_KEY = "YOUR_API_KEY_HERE" 這行，換成你的 Anthropic API Key（sk-ant-...）後存檔');return;}
  const rows=getRows(),btn=document.getElementById('ai-btn'),box=document.getElementById('ai-box'),ct=document.getElementById('ai-content');
  btn.disabled=true;btn.textContent='⏳ 分析中...';box.style.display='block';ct.textContent='分析資料中，請稍候...';

  const bullList=rows.filter(r=>techFromK(r.kline).score>=3).map(r=>r.name+'('+r.code+')').join('、')||'無';
  const bearList=rows.filter(r=>techFromK(r.kline).score===0).map(r=>r.name+'('+r.code+')').join('、')||'無';
  const confRows=rows.filter(r=>CONFIRMED.has(r.code));
  const confList=confRows.map(r=>`${r.name}(${r.code}) 分:${r.score.toFixed(1)} 股價:${r.price>0?r.price.toLocaleString():'N/A'} 近4Q毛利:${r.gm_4q>0?r.gm_4q.toFixed(1)+'%':'N/A'} EPS近4Q:${r.eps_4q!==0?r.eps_4q.toFixed(2):'N/A'} 技術:${techFromK(r.kline).l}`).join('\n');
  const revUp=rows.filter(r=>r.rev_up).map(r=>r.name).join('、')||'無';
  const epsUp=rows.filter(r=>r.eps_up).map(r=>r.name).join('、')||'無';
  const now=new Date(),ds=now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate();

  const prompt=`你是一位專業台股科技產業分析師，專注 AI 基礎建設供應鏈研究。今天是 ${ds}。

【主要供應商（★ 持倉名單）】
${confList||'無'}

【技術面多頭個股】${bullList}
【技術面空頭個股】${bearList}
【本期營收噴出】${revUp}
【本期EPS噴出】${epsUp}

【前10高分個股】
${rows.slice(0,10).map(r=>`${r.name}(${r.code}) T${r.tier} 分:${r.score.toFixed(1)} 股:${r.price>0?r.price.toLocaleString():'N/A'} 技術:${techFromK(r.kline).l}`).join('\n')}
